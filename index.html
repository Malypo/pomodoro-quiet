<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pomodoro du chat rond</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8EACB;--panel:#FBF1D9;--ink:#4A2E1A;--muted:#8C5A3A;--accent:#C2571F;--on-accent:#FFF6E0;--line:#C9A877;--soft:#F0DCB4;--soft-line:#D8C49A;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.4;min-height:100vh;padding:16px}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid #E8B44A;outline-offset:2px}
.app{max-width:1040px;margin:0 auto;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:880px){.app{grid-template-columns:minmax(0,1fr) 380px;align-items:start}}
.stage{border:1px solid var(--soft-line);border-radius:16px;overflow:hidden;background:var(--soft)}
.stage svg{display:block;width:100%;height:auto}
.panel{border:1px solid var(--soft-line);border-radius:16px;padding:16px;background:var(--panel)}
.stack{display:flex;flex-direction:column;gap:16px}
h1{font-size:22px;font-weight:800;margin:0}
.label{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
.small{font-size:12px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center}
.between{justify-content:space-between}
.center{text-align:center}
.seg{display:flex;gap:8px}
.durs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.opt{height:44px;border-radius:10px;border:1px solid var(--line);background:transparent;color:#6E4328;font-size:15px;padding:0 6px;flex:1}
.opt[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.card{background:var(--soft);border:1px solid var(--soft-line);border-radius:10px;padding:10px 12px}
.cut{font-size:15px;margin:2px 0 6px}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.check .cl{display:block;font-size:15px}
.mini{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:transparent;color:#6E4328;font-size:13px}
.go{height:48px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font-weight:800;font-size:17px}
.icon{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:transparent;color:#6E4328;display:flex;align-items:center;justify-content:center;padding:0}
.chip{display:inline-block;font-size:14px;font-weight:800;border-radius:10px;padding:3px 14px}
.time{font-size:60px;font-weight:800;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums}
.bar{position:relative;height:14px;border-radius:7px;background:#E2C9A0;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;min-height:16px}
.legend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.sun,.moon{transform-box:fill-box;transform-origin:center;animation:pulse 6s ease-in-out infinite}
.star{animation:tw 3s ease-in-out infinite}
.s1{animation-delay:1.2s}.s2{animation-delay:2.1s}
.drift{animation:drift 9s ease-in-out infinite alternate}
.rain{animation:fall .7s linear infinite}
.ln{transform-box:fill-box;transform-origin:left center;animation:typing 4.5s steps(10) infinite}
.l2{animation-delay:1s}.l3{animation-delay:2s}
.cur{animation:blink 1s steps(1) infinite}
.lap{transform-box:fill-box;transform-origin:50% 100%;animation:lap 1.1s ease-in-out infinite}
.rip{transform-box:fill-box;transform-origin:center;animation:rip 1.6s ease-out infinite;opacity:0}
.chew{transform-box:fill-box;transform-origin:center;animation:chew .6s ease-in-out infinite}
.scr{animation:flick 6s ease-in-out infinite}
.ball{animation:roll 4s ease-in-out infinite}
.glow{animation:gl 6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes drift{from{transform:translateX(-7px)}to{transform:translateX(7px)}}
@keyframes fall{from{transform:translateY(0)}to{transform:translateY(20px)}}
@keyframes typing{0%{transform:scaleX(0)}55%,92%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes lap{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.96)}}
@keyframes rip{0%{opacity:.9;transform:scale(.5)}100%{opacity:0;transform:scale(3)}}
@keyframes chew{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
@keyframes flick{0%,100%{fill:#FFE9A8}33%{fill:#F6C76A}66%{fill:#F9D9B5}}
@keyframes roll{0%,100%{transform:translateX(0)}50%{transform:translateX(44px)}}
@keyframes gl{0%,100%{opacity:.16}50%{opacity:.26}}
@media (prefers-reduced-motion:reduce){
.sun,.moon,.star,.drift,.rain,.ln,.cur,.lap,.rip,.chew,.scr,.ball,.glow{animation:none}
.ln{transform:none}
}
</style>
</head>
<body>
<main class="app">
<section class="stage" aria-label="Scène"><div id="scene"></div></section>
<section class="panel">
<div id="setup" class="stack">
<h1>Pomodoro</h1>
<div><div class="label" id="l-moment">Moment</div><div class="seg" role="radiogroup" aria-labelledby="l-moment" id="g-moment"></div></div>
<div><div class="label" id="l-weather">Météo</div><div class="seg" role="radiogroup" aria-labelledby="l-weather" id="g-weather"></div></div>
<div><div class="label" id="l-hours">Durée de travail</div><div class="durs" role="radiogroup" aria-labelledby="l-hours" id="g-hours"></div></div>
<div class="card"><div class="small">Découpage</div><div class="cut" id="cut"></div><div class="small">Total : <b id="tot"></b></div></div>
<label class="check"><input type="checkbox" id="awake"><span><span class="cl">Garder l'écran allumé</span><span class="small" id="awakeNote">Évite la veille pendant la session. Utilise plus de batterie.</span></span></label>
<div class="row"><span class="small">Écouter les sons :</span><button type="button" class="mini" id="t-start">Début</button><button type="button" class="mini" id="t-end">Fin</button></div>
<button type="button" class="go" id="go">Démarrer</button>
</div>
<div id="running" class="stack" hidden>
<div class="row between"><span class="small" id="recap"></span><button type="button" class="icon" id="snd" aria-label="Couper le son"></button></div>
<div class="center"><span class="chip" id="chip">Travail</span><div class="time" id="time">25:00</div><div class="small" id="sub1"></div><div class="small" id="sub2"></div></div>
<div><div class="bar" id="bar"></div><div class="legend" id="legend"></div><div class="small center" id="elapsed"></div></div>
<div class="row"><button type="button" class="opt" id="pause">Pause</button><button type="button" class="opt" id="stop">Arrêter</button></div>
</div>
</section>
</main>
<div class="sr" id="live" aria-live="polite"></div>
<noscript>Cette page a besoin de JavaScript pour fonctionner.</noscript>
<script>
(function(){
'use strict';

/* ============================================================
   1. DÉCOUPAGE DES SESSIONS (modifiable)
   Un cycle = 25 min de travail + 5 min de pause eau.
   t : work (travail), water (pause eau), tv (pause télé), lunch (déjeuner)
   ============================================================ */
var WORK = 25 * 60;
var SHORT = 5 * 60;
function cyc(n){ var a = []; for (var i = 0; i < n; i++){ a.push({t:'work', d:WORK}, {t:'water', d:SHORT}); } return a; }
function seg(t, min){ return {t:t, d:min * 60}; }
function bloc3h(){ return cyc(3).concat([seg('tv', 10)], cyc(2), [seg('work', 20)]); }
function bloc4h(){ return cyc(4).concat([seg('tv', 15)], cyc(3), [seg('work', 15)]); }
function dej(){ return [seg('lunch', 60)]; }
var SCHEDULES = {
  1: function(){ return cyc(2); },
  2: function(){ return cyc(4); },
  3: bloc3h,
  4: bloc4h,
  5: function(){ return bloc4h().concat(dej(), cyc(2)); },
  6: function(){ return bloc4h().concat(dej(), cyc(4)); },
  7: function(){ return bloc4h().concat(dej(), bloc3h()); },
  8: function(){ return bloc4h().concat(dej(), bloc4h()); }
};
var CUTS = {
  1:'1h', 2:'2h',
  3:'1h30 · pause 10 min · 1h20',
  4:'2h · pause 15 min · 1h45',
  5:'2h · 15 min · 1h45 · déjeuner 1h · 1h',
  6:'2h · 15 min · 1h45 · déjeuner 1h · 2h',
  7:'2h · 15 min · 1h45 · déjeuner 1h · 1h30 · 10 min · 1h20',
  8:'2h · 15 min · 1h45 · déjeuner 1h · 2h · 15 min · 1h45'
};
var NAMES = {work:'Travail', water:'Pause eau', tv:'Pause télé', lunch:'Déjeuner'};
var NEXT = {work:'reprise du travail', water:'pause eau', tv:'pause télé', lunch:'déjeuner'};
var CHIP = {work:['#F0C96A','#6E4328'], water:['#A8D8E0','#2F5F6B'], tv:['#E8B44A','#6E4328'], lunch:['#C98B4F','#3A2312']};
var OPTS = {
  moment:[['jour','Journée'],['soir','Soir']],
  weather:[['sun','Soleil'],['cloud','Nuageux'],['rain','Pluie']]
};

/* ============================================================
   2. DESSIN DES SCÈNES
   ============================================================ */
function f1(v){ return +v.toFixed(1); }

function sky(m, wt, w, h){
  var night = m === 'soir';
  var X = function(v){ return f1(v * w); };
  var Y = function(v){ return f1(v * h); };
  var P = {
    jour:{
      sun:{s:'#FBE7B5',L:'#E8C48A',R:'#D9A765',r:'#8C5A3A',w:'#F6D78A'},
      cloud:{s:'#DDD0B8',L:'#DDC08F',R:'#CFA469',r:'#7E5A44',w:'#E8CFA0'},
      rain:{s:'#B7AC9A',L:'#CDB48B',R:'#BE9966',r:'#6E5040',w:'#E0C48A'}
    },
    soir:{
      sun:{s:'#3A2A30',L:'#2B1E18',R:'#33241C',r:'#2B1E18',w:'#F6C76A'},
      cloud:{s:'#3A2A30',L:'#2B1E18',R:'#33241C',r:'#2B1E18',w:'#F6C76A'},
      rain:{s:'#2B2230',L:'#2B1E18',R:'#33241C',r:'#2B1E18',w:'#F6C76A'}
    }
  }[m][wt];
  var o = '<rect width="' + w + '" height="' + h + '" fill="' + P.s + '"/>';
  if (!night && wt === 'sun') o += '<circle class="sun" cx="' + X(.765) + '" cy="' + Y(.16) + '" r="' + f1(w * .1) + '" fill="#F4B63F"/>';
  if (!night && wt === 'cloud') o += '<circle cx="' + X(.676) + '" cy="' + Y(.16) + '" r="' + f1(w * .13) + '" fill="#F2DDA6"/>';
  if (night && wt !== 'rain'){
    o += '<circle class="moon" cx="' + X(.765) + '" cy="' + Y(.16) + '" r="' + f1(w * .1) + '" fill="' + (wt === 'sun' ? '#F8EACB' : '#D9C9AE') + '"/>';
    if (wt === 'sun'){
      [[.18,.14],[.38,.3],[.56,.09],[.91,.36],[.12,.39]].forEach(function(p, i){
        o += '<circle class="star s' + (i % 3) + '" cx="' + X(p[0]) + '" cy="' + Y(p[1]) + '" r="1.4" fill="#F8EACB"/>';
      });
    }
  }
  o += '<rect x="0" y="' + Y(.568) + '" width="' + X(.441) + '" height="' + Y(.432) + '" fill="' + P.L + '"/>';
  o += '<polygon points="0,' + Y(.568) + ' ' + X(.088) + ',' + Y(.455) + ' ' + X(.353) + ',' + Y(.455) + ' ' + X(.441) + ',' + Y(.568) + '" fill="' + P.r + '"/>';
  o += '<rect x="' + X(.441) + '" y="' + Y(.409) + '" width="' + X(.559) + '" height="' + Y(.591) + '" fill="' + P.R + '"/>';
  o += '<polygon points="' + X(.441) + ',' + Y(.409) + ' ' + X(.529) + ',' + Y(.295) + ' ' + X(.912) + ',' + Y(.295) + ' ' + X(1) + ',' + Y(.409) + '" fill="' + P.r + '"/>';
  [[.074,.636],[.25,.636],[.074,.795],[.25,.795]].forEach(function(p, i){
    if (!night || i === 0 || i === 3) o += '<rect x="' + X(p[0]) + '" y="' + Y(p[1]) + '" width="' + X(.088) + '" height="' + Y(.102) + '" fill="' + P.w + '"/>';
  });
  [[.529,.477],[.794,.477],[.529,.682],[.794,.682]].forEach(function(p, i){
    if (!night || i !== 1) o += '<rect x="' + X(p[0]) + '" y="' + Y(p[1]) + '" width="' + X(.103) + '" height="' + Y(.114) + '" fill="' + P.w + '"/>';
  });
  var ell = function(cx, cy, rx, ry, fill){
    return '<ellipse cx="' + X(cx) + '" cy="' + Y(cy) + '" rx="' + X(rx) + '" ry="' + Y(ry) + '" fill="' + fill + '"/>';
  };
  if (wt === 'cloud'){
    o += '<g class="drift">' + (night
      ? ell(.68,.18,.235,.08,'#5A4650') + ell(.41,.125,.176,.09,'#5A4650') + ell(.12,.27,.235,.068,'#4A3A48') + ell(.88,.045,.176,.057,'#4A3A48')
      : ell(.235,.18,.235,.08,'#F6EEDD') + ell(.41,.125,.176,.09,'#F6EEDD') + ell(.735,.227,.22,.08,'#EFE4CE') + ell(.147,.364,.176,.057,'#EFE4CE')) + '</g>';
  }
  if (wt === 'rain'){
    var c = night ? '#4A3A48' : '#8F8472';
    o += '<g class="drift">' + ell(.147,.09,.265,.1,c) + ell(.5,.045,.235,.1,c) + ell(.853,.114,.235,.09,c) + '</g>';
    o += '<rect class="rain" x="0" y="-20" width="' + w + '" height="' + (h + 20) + '" fill="url(#' + (night ? 'rainN' : 'rainD') + ')"/>';
  }
  return o;
}

function win(x, y, w, h, m, wt, fc){
  return '<clipPath id="wc"><rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '"/></clipPath>' +
    '<g clip-path="url(#wc)"><g transform="translate(' + x + ',' + y + ')">' + sky(m, wt, w, h) + '</g></g>' +
    '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" fill="none" stroke="' + fc + '" stroke-width="5"/>';
}

function tiles(col){
  var s = '<g fill="' + col + '">';
  [0,76,152,228,304].forEach(function(x){ s += '<rect x="' + x + '" y="230" width="38" height="40"/>'; });
  [38,114,190,266,342].forEach(function(x){ s += '<rect x="' + x + '" y="270" width="38" height="40"/>'; });
  return s + '</g>';
}

function bgDay(wt){
  var wall = {sun:'#F0DCB4', cloud:'#E6D3B3', rain:'#D8C5A4'}[wt];
  var s = '<rect width="380" height="230" fill="' + wall + '"/>';
  s += '<rect y="176" width="380" height="54" fill="#A8693A"/><rect y="172" width="380" height="6" fill="#7A4524"/>';
  s += '<g stroke="#8F5630" stroke-width="1">';
  [63,126,190,253,316].forEach(function(x){ s += '<line x1="' + x + '" y1="178" x2="' + x + '" y2="230"/>'; });
  s += '</g><rect y="230" width="380" height="80" fill="#F2E4C6"/>' + tiles('#E2B070');
  s += win(44, 30, 122, 124, 'jour', wt, '#7A4524');
  s += '<line x1="105" y1="30" x2="105" y2="154" stroke="#7A4524" stroke-width="4"/><line x1="44" y1="92" x2="166" y2="92" stroke="#7A4524" stroke-width="4"/><rect x="36" y="154" width="138" height="7" fill="#7A4524"/>';
  s += '<rect x="52" y="142" width="14" height="12" fill="#C2571F"/><ellipse cx="55" cy="136" rx="4" ry="8" fill="#8A8F3F"/><ellipse cx="63" cy="137" rx="4" ry="7" fill="#6F7A34"/>';
  s += '<rect x="238" y="82" width="112" height="5" fill="#7A4524"/>';
  [[242,58,10,24,'#D9772B'],[253,62,9,20,'#8C5A3A'],[263,56,11,26,'#E8B44A'],[275,64,8,18,'#C2571F'],[284,60,10,22,'#6E4328'],[304,64,12,18,'#F0C96A'],[318,58,9,24,'#D9772B']].forEach(function(b){
    s += '<rect x="' + b[0] + '" y="' + b[1] + '" width="' + b[2] + '" height="' + b[3] + '" fill="' + b[4] + '"/>';
  });
  s += '<rect x="262" y="106" width="44" height="34" fill="#F8EACB" stroke="#7A4524" stroke-width="3"/><path d="M268 134l10-12 8 8 8-10 8 14Z" fill="#E8B44A"/><circle cx="296" cy="116" r="4" fill="#D9772B"/>';
  s += '<line x1="210" y1="0" x2="210" y2="30" stroke="#6E4328" stroke-width="2"/><path d="M194 46q0-16 16-16t16 16Z" fill="#C2571F"/><ellipse cx="210" cy="48" rx="8" ry="3" fill="#FFE9A8"/>';
  if (wt === 'rain') s += '<rect width="380" height="230" fill="#3A2A30" opacity=".1"/>';
  return s;
}

function bgNight(wt, on, table){
  var s = '<rect width="380" height="230" fill="#B27B4C"/><rect y="222" width="380" height="8" fill="#6E4328"/><rect y="230" width="380" height="80" fill="#8C5A3A"/>';
  s += '<g stroke="#7A4524" stroke-width="1.5"><line x1="0" y1="252" x2="380" y2="252"/><line x1="0" y1="274" x2="380" y2="274"/><line x1="0" y1="296" x2="380" y2="296"/></g>';
  s += win(152, 38, 76, 96, 'soir', wt, '#6E4328');
  s += '<line x1="190" y1="38" x2="190" y2="134" stroke="#6E4328" stroke-width="4"/><rect x="146" y="134" width="88" height="6" fill="#6E4328"/>';
  s += '<rect x="132" y="30" width="16" height="112" fill="#D9772B"/><rect x="232" y="30" width="16" height="112" fill="#D9772B"/><line x1="124" y1="30" x2="256" y2="30" stroke="#6E4328" stroke-width="3"/>';
  s += '<rect x="268" y="96" width="86" height="5" fill="#6E4328"/>';
  [[272,72,10,24,'#D9772B'],[283,76,9,20,'#E8B44A'],[293,70,11,26,'#6E4328'],[305,78,8,18,'#C2571F'],[314,74,10,22,'#F0C96A'],[326,78,12,18,'#D9772B']].forEach(function(b){
    s += '<rect x="' + b[0] + '" y="' + b[1] + '" width="' + b[2] + '" height="' + b[3] + '" fill="' + b[4] + '"/>';
  });
  s += '<rect x="62" y="66" width="44" height="36" fill="#F0DCB4" stroke="#6E4328" stroke-width="3"/><path d="M68 96l12-14 9 9 9-12 8 17Z" fill="#E8B44A"/><circle cx="96" cy="76" r="4" fill="#D9772B"/>';
  if (on) s += '<ellipse cx="34" cy="112" rx="52" ry="44" fill="#FFE9A8" opacity=".25"/>';
  s += '<rect x="33" y="126" width="3" height="172" fill="#6E4328"/><ellipse cx="34" cy="298" rx="14" ry="4" fill="#6E4328"/><path d="M14 128L54 128L46 94L22 94Z" fill="' + (on ? '#E8B44A' : '#7A4524') + '"/>';
  if (table){
    if (on) s += '<ellipse cx="337" cy="186" rx="50" ry="40" fill="#FFE9A8" opacity=".25"/>';
    s += '<rect x="314" y="214" width="46" height="6" fill="#6E4328"/><rect x="320" y="220" width="3" height="76" fill="#6E4328"/><rect x="351" y="220" width="3" height="76" fill="#6E4328"/><rect x="332" y="198" width="10" height="16" fill="#C2571F"/><path d="M318 198L356 198L350 170L324 170Z" fill="' + (on ? '#F0C96A' : '#8C5A3A') + '"/>';
  }
  s += '<ellipse cx="190" cy="294" rx="150" ry="16" fill="#D9A765"/><ellipse cx="190" cy="294" rx="130" ry="11" fill="none" stroke="#C2571F" stroke-width="2"/>';
  return s;
}

function rugDay(cx){
  return '<ellipse cx="' + cx + '" cy="278" rx="122" ry="24" fill="#E9C07A"/><ellipse cx="' + cx + '" cy="278" rx="104" ry="18" fill="none" stroke="#D9772B" stroke-width="2"/>';
}

function blob(cx, mode){
  var dx = cx - 130;
  var arcs = '<path d="M127 242q4-5 8 0M147 242q4-5 8 0" stroke="#FFF6E0" stroke-width="2.2" fill="none" stroke-linecap="round"/>';
  var face;
  if (mode === 'drink') face = arcs;
  else if (mode === 'eat') face = arcs + '<ellipse class="chew" cx="141" cy="251" rx="4" ry="3.5" fill="#FFF6E0"/>';
  else if (mode === 'blank') face = '';
  else {
    var sh = mode === 'tv' ? 6 : 0;
    face = '<circle cx="' + (126 + sh) + '" cy="240" r="3" fill="#FFF6E0"/><circle cx="' + (151 + sh) + '" cy="240" r="3" fill="#FFF6E0"/><path d="M' + (134 + sh) + ' 248q4 4 8 0" stroke="#FFF6E0" stroke-width="2" fill="none" stroke-linecap="round"/>';
  }
  var body = '<ellipse cx="116" cy="270" rx="10" ry="5" fill="#26201E"/><ellipse cx="146" cy="270" rx="10" ry="5" fill="#26201E"/>' +
    '<circle cx="106" cy="214" r="10" fill="#26201E"/><circle cx="154" cy="214" r="10" fill="#26201E"/>' +
    '<ellipse cx="130" cy="242" rx="35" ry="29" fill="#26201E"/>' +
    '<path d="M97 236C96 204 164 204 163 236" stroke="#E8B44A" stroke-width="5" fill="none" stroke-linecap="round"/>' +
    '<ellipse cx="96" cy="240" rx="6" ry="11" fill="#C2571F"/><ellipse cx="164" cy="240" rx="6" ry="11" fill="#C2571F"/>' +
    face +
    '<ellipse cx="116" cy="250" rx="5" ry="3" fill="#C46A6A"/><ellipse cx="158" cy="250" rx="5" ry="3" fill="#C46A6A"/>';
  var inner = '<g transform="translate(' + dx + ',0)">' + body + '</g>';
  return (mode === 'drink' || mode === 'eat') ? '<g class="lap">' + inner + '</g>' : inner;
}

function basketBack(tx, cush){
  return '<g transform="translate(' + tx + ',0)"><ellipse cx="130" cy="258" rx="60" ry="12" fill="#5A3620" stroke="#A8693A" stroke-width="4"/>' +
    (cush ? '<ellipse cx="130" cy="262" rx="44" ry="7" fill="#F0C96A"/>' : '') + '</g>';
}
function basketFront(tx){
  return '<g transform="translate(' + tx + ',0)"><path d="M68 258Q130 278 192 258L194 268Q192 302 160 304L100 304Q68 302 66 268Z" fill="#C98B4F"/>' +
    '<g fill="none" stroke="#A8693A" stroke-width="1.5"><path d="M67 278Q130 296 193 278"/><path d="M68 290Q130 306 192 290"/><line x1="100" y1="268" x2="100" y2="304"/><line x1="130" y1="272" x2="130" y2="304"/><line x1="160" y1="268" x2="160" y2="304"/></g>' +
    '<path d="M68 258Q130 278 192 258" stroke="#A8693A" stroke-width="4" fill="none"/></g>';
}

function bowl(cx, kind){
  var s = '<path d="M' + (cx - 26) + ' 268h52l-7 14h-38Z" fill="#C2571F"/><ellipse cx="' + cx + '" cy="268" rx="26" ry="5" fill="#E8B44A"/>';
  if (kind === 'water'){
    s += '<ellipse cx="' + cx + '" cy="268" rx="21" ry="3" fill="#A8D8E0"/><ellipse class="rip" cx="' + (cx - 6) + '" cy="267" rx="5" ry="1" fill="none" stroke="#FFFFFF" stroke-width="1"/>';
  } else {
    s += '<ellipse cx="' + cx + '" cy="265" rx="20" ry="5" fill="#8C5A3A"/>';
    [[-10,-2,'#C2571F'],[-1,-4,'#6E4328'],[8,-2,'#D9772B'],[-6,2,'#6E4328'],[4,2,'#C2571F'],[12,2,'#8C5A3A']].forEach(function(p){
      s += '<circle cx="' + (cx + p[0]) + '" cy="' + (265 + p[1]) + '" r="2.4" fill="' + p[2] + '"/>';
    });
  }
  return s;
}
function straw(bx, blobx){
  return '<path d="M' + (bx - 6) + ' 270L' + (bx - 6) + ' 254L' + (blobx + 16) + ' 252" stroke="#D13B2E" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
}

function laptop(ox, oy, glow){
  return '<g transform="translate(' + ox + ',' + oy + ')">' +
    (glow ? '<ellipse cx="254" cy="250" rx="44" ry="30" fill="#FFE9A8" opacity=".2"/>' : '') +
    '<polygon points="196,270 244,270 258,262 210,262" fill="#D8CFC0" stroke="#B5A98F"/>' +
    '<polygon points="210,262 258,262 258,228 210,234" fill="#FFF1C9" stroke="#B5A98F" stroke-width="1.5"/>' +
    '<rect class="ln" x="217" y="241" width="32" height="3.5" rx="1.7" fill="#E8B44A"/>' +
    '<rect class="ln l2" x="217" y="248" width="24" height="3.5" rx="1.7" fill="#D9772B"/>' +
    '<rect class="ln l3" x="217" y="255" width="30" height="3.5" rx="1.7" fill="#C2571F"/>' +
    '<rect class="cur" x="250" y="254" width="3" height="6" fill="#6E4328"/></g>';
}

function tvDay(){
  return '<rect x="226" y="244" width="116" height="30" fill="#A8693A" stroke="#7A4524" stroke-width="2"/><line x1="284" y1="246" x2="284" y2="272" stroke="#7A4524" stroke-width="2"/>' +
    '<rect x="238" y="188" width="92" height="56" rx="4" fill="#4A3426"/><rect class="scr" x="244" y="194" width="80" height="44" rx="2" fill="#FFE9A8"/>' +
    '<g class="ball"><circle cx="258" cy="216" r="7" fill="#D9772B"/></g><rect x="252" y="228" width="64" height="4" rx="2" fill="#C2571F"/>';
}
function tvNight(){
  return '<ellipse class="glow" cx="290" cy="224" rx="110" ry="76" fill="#FFE9A8" opacity=".2"/>' +
    '<rect x="236" y="250" width="110" height="28" fill="#A8693A" stroke="#7A4524" stroke-width="2"/><line x1="291" y1="252" x2="291" y2="276" stroke="#7A4524" stroke-width="2"/>' +
    '<rect x="244" y="190" width="92" height="60" rx="4" fill="#4A3426"/><rect class="scr" x="250" y="196" width="80" height="48" rx="2" fill="#FFE9A8"/>' +
    '<g class="ball"><circle cx="264" cy="218" r="7" fill="#D9772B"/></g><rect x="258" y="232" width="64" height="4" rx="2" fill="#C2571F"/>';
}

function scene(m, wt, ph){
  var bg, fg;
  if (m === 'jour'){
    bg = bgDay(wt);
    if (ph === 'work') fg = rugDay(190) + laptop(0, 0, false) + blob(130, 'work');
    else if (ph === 'water') fg = rugDay(190) + blob(130, 'drink') + bowl(188, 'water') + straw(188, 130);
    else if (ph === 'tv') fg = rugDay(170) + blob(110, 'tv') + tvDay();
    else fg = rugDay(190) + blob(130, 'eat') + bowl(188, 'food');
  } else {
    if (ph === 'tv'){
      bg = bgNight(wt, false, false);
      fg = basketBack(0, false) + blob(130, 'blank') + basketFront(0) +
        '<rect width="380" height="310" fill="#1E1410" opacity=".76"/>' + tvNight() +
        '<circle cx="138" cy="240" r="3" fill="#FFF6E0"/><circle cx="160" cy="240" r="3" fill="#FFF6E0"/><path d="M144 248q4 4 8 0" stroke="#FFF6E0" stroke-width="2" fill="none" stroke-linecap="round"/>';
    } else {
      bg = bgNight(wt, true, true);
      if (ph === 'work') fg = basketBack(-60, true) + laptop(10, 16, true) + blob(176, 'work') + basketFront(-60);
      else if (ph === 'water') fg = basketBack(-60, true) + blob(176, 'drink') + bowl(232, 'water') + straw(232, 176) + basketFront(-60);
      else fg = basketBack(-60, true) + blob(176, 'eat') + bowl(232, 'food') + basketFront(-60);
    }
  }
  var label = 'Petit personnage rond : ' + NAMES[ph].toLowerCase();
  return '<svg viewBox="0 0 380 310" role="img" aria-label="' + label + '"><defs>' +
    '<pattern id="rainD" width="14" height="20" patternUnits="userSpaceOnUse"><line x1="4" y1="2" x2="2" y2="10" stroke="#F4EAD6" stroke-width="1.3" stroke-linecap="round"/><line x1="11" y1="11" x2="9" y2="19" stroke="#F4EAD6" stroke-width="1.3" stroke-linecap="round"/></pattern>' +
    '<pattern id="rainN" width="14" height="20" patternUnits="userSpaceOnUse"><line x1="4" y1="2" x2="2" y2="10" stroke="#D9C9AE" stroke-width="1.3" stroke-linecap="round"/><line x1="11" y1="11" x2="9" y2="19" stroke="#D9C9AE" stroke-width="1.3" stroke-linecap="round"/></pattern>' +
    '</defs>' + bg + fg + '</svg>';
}

/* ============================================================
   3. ÉTAT ET OUTILS
   ============================================================ */
function $(id){ return document.getElementById(id); }
var BASE_TITLE = document.title;
var state = {moment:'jour', weather:'sun', hours:4, awake:true, sound:true};
var STORE = 'pomodoro-chat-rond';

function loadState(){
  try {
    var j = JSON.parse(localStorage.getItem(STORE) || '{}');
    if (j.moment === 'jour' || j.moment === 'soir') state.moment = j.moment;
    if (j.weather === 'sun' || j.weather === 'cloud' || j.weather === 'rain') state.weather = j.weather;
    if (j.hours >= 1 && j.hours <= 8) state.hours = Math.round(j.hours);
    if (typeof j.awake === 'boolean') state.awake = j.awake;
    if (typeof j.sound === 'boolean') state.sound = j.sound;
  } catch (e) {}
}
function saveState(){ try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} }

function pad(n){ return (n < 10 ? '0' : '') + n; }
function fmtClock(s){
  s = Math.max(0, Math.ceil(s));
  var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
  return h > 0 ? h + ':' + pad(m) + ':' + pad(r) : pad(m) + ':' + pad(r);
}
function fmtHM(s){
  var m = Math.floor(s / 60), h = Math.floor(m / 60), mm = m % 60;
  if (h === 0) return mm + ' min';
  return h + 'h' + (mm ? pad(mm) : '');
}
function fmtDur(d){
  var m = d / 60;
  return m < 60 ? m + ' min' : (m / 60) + 'h';
}
function totalOf(sched){ return sched.reduce(function(a, s){ return a + s.d; }, 0); }

/* ============================================================
   4. SONS (Web Audio, aucun fichier)
   ============================================================ */
var ac = null;
function ensureAudio(){
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state !== 'running') return ac.resume();
  } catch (e) {}
  return Promise.resolve();
}
function tone(freq, t0, dur, type, gain){
  var o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
function chime(kind, force){
  if (!force && !state.sound) return;
  var go = function(){
    if (!ac) return;
    var t = ac.currentTime + 0.05;
    if (kind === 'start'){
      [523.25, 659.25, 783.99, 1046.5].forEach(function(f, i){ tone(f, t + i * 0.12, 0.45, 'triangle', 0.5); });
    } else {
      [783.99, 587.33, 392].forEach(function(f, i){ tone(f, t + i * 0.28, 1.1, 'sine', 0.6); });
    }
  };
  var p = ensureAudio();
  if (p && p.then) p.then(go, go); else go();
}

/* ============================================================
   5. ÉCRAN ALLUMÉ
   ============================================================ */
var wl = null;
function lockOn(){
  if (!state.awake || !('wakeLock' in navigator)) return;
  try {
    navigator.wakeLock.request('screen').then(function(l){
      wl = l;
      l.addEventListener('release', function(){ if (wl === l) wl = null; });
    }).catch(function(){});
  } catch (e) {}
}
function lockOff(){
  if (wl){ try { wl.release(); } catch (e) {} wl = null; }
}

/* ============================================================
   6. RÉGLAGES (écran de départ)
   ============================================================ */
var sceneKey = '';
function drawScene(m, wt, ph){
  var k = m + '|' + wt + '|' + ph;
  if (k === sceneKey) return;
  sceneKey = k;
  $('scene').innerHTML = scene(m, wt, ph);
}

function buildGroup(el, items, key, cls){
  el.innerHTML = '';
  items.forEach(function(it){
    var b = document.createElement('button');
    b.type = 'button'; b.className = cls; b.setAttribute('role', 'radio');
    b.dataset.v = it[0]; b.textContent = it[1];
    b.addEventListener('click', function(){
      state[key] = key === 'hours' ? +it[0] : it[0];
      saveState(); refreshSetup();
    });
    el.appendChild(b);
  });
}
function markGroup(el, val){
  Array.prototype.forEach.call(el.children, function(b){
    b.setAttribute('aria-checked', String(b.dataset.v === String(val)));
  });
}
function refreshSetup(){
  markGroup($('g-moment'), state.moment);
  markGroup($('g-weather'), state.weather);
  markGroup($('g-hours'), state.hours);
  var sched = SCHEDULES[state.hours]();
  $('cut').textContent = CUTS[state.hours];
  $('tot').textContent = fmtHM(totalOf(sched)) + (state.hours > 4 ? ' (déjeuner compris)' : '');
  $('awake').checked = state.awake;
  if (!run) drawScene(state.moment, state.weather, 'work');
}

/* ============================================================
   7. SESSION
   ============================================================ */
var run = null, worker = null, timer = null, confirmTimer = null;
var SPK = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/>';
function paintSound(){
  $('snd').innerHTML = SPK + (state.sound ? '<path d="M16 9a4 4 0 0 1 0 6"/><path d="M18.5 6.5a8 8 0 0 1 0 11"/>' : '<path d="M17 9l5 6M22 9l-5 6"/>') + '</svg>';
  $('snd').setAttribute('aria-label', state.sound ? 'Couper le son' : 'Activer le son');
}

function startSession(){
  ensureAudio();
  var sched = SCHEDULES[state.hours](), c = 0;
  var cum = sched.map(function(s){ var o = {t:s.t, d:s.d, a:c, b:c + s.d}; c += s.d; return o; });
  run = {
    sched:cum, total:c, start:Date.now(), paused:false, pausedAt:0, pauseTotal:0,
    idx:-1, lastTick:Date.now(), done:false,
    nWork:cum.filter(function(s){ return s.t === 'work'; }).length
  };
  $('setup').hidden = true; $('running').hidden = false;
  $('recap').textContent = (state.moment === 'jour' ? 'Journée' : 'Soir') + ' · ' + {sun:'Soleil', cloud:'Nuageux', rain:'Pluie'}[state.weather] + ' · ' + state.hours + 'h';
  $('pause').textContent = 'Pause'; $('pause').hidden = false;
  $('stop').textContent = 'Arrêter';
  buildBar(); paintSound(); lockOn(); startTicker();
  chime('start');
  tick(true);
}

function buildBar(){
  var bar = $('bar'), seen = {};
  bar.innerHTML = '';
  run.sched.forEach(function(s){
    if (s.t === 'tv' || s.t === 'lunch'){
      seen[s.t] = true;
      var i = document.createElement('i');
      i.style.left = (s.a / run.total * 100) + '%';
      i.style.width = (s.d / run.total * 100) + '%';
      i.style.background = s.t === 'tv' ? '#E8B44A' : '#8C5A3A';
      bar.appendChild(i);
    }
  });
  var d = document.createElement('i');
  d.id = 'barDone'; d.style.left = '0'; d.style.width = '0'; d.style.background = 'rgba(74,46,26,.38)';
  bar.appendChild(d);
  var lg = '';
  if (seen.tv) lg += '<span><b style="background:#E8B44A"></b>Pause télé</span>';
  if (seen.lunch) lg += '<span><b style="background:#8C5A3A"></b>Déjeuner</span>';
  $('legend').innerHTML = lg;
}

function elapsedSec(now){ return ((run.paused ? run.pausedAt : now) - run.start - run.pauseTotal) / 1000; }

function tick(first){
  if (!run) return;
  var now = Date.now(), gap = now - run.lastTick;
  run.lastTick = now;
  var e = Math.max(0, elapsedSec(now));
  var idx = -1;
  for (var i = 0; i < run.sched.length; i++){ if (e < run.sched[i].b){ idx = i; break; } }
  if (idx < 0) idx = run.sched.length;
  if (idx !== run.idx){
    var prev = run.idx;
    run.idx = idx;
    if (idx >= run.sched.length) run.done = true;
    if (!first && gap < 90000) playFor(prev, idx);
    drawScene(state.moment, state.weather, run.done ? 'work' : run.sched[idx].t);
    $('live').textContent = run.done ? 'Session terminée' : NAMES[run.sched[idx].t];
    if (run.done){ finishUi(); }
  }
  paint(e);
}

function playFor(prev, idx){
  if (idx >= run.sched.length){ chime('finish'); return; }
  var cur = run.sched[idx], p = prev >= 0 ? run.sched[prev] : null;
  if (cur.t === 'work') chime('start');
  else if (p && p.t === 'work') chime('finish');
}

function finishUi(){
  $('pause').hidden = true;
  $('stop').textContent = 'Nouvelle session';
  lockOff();
}

function paint(e){
  var chip = $('chip');
  if (run.done){
    chip.textContent = 'Session terminée'; chip.style.background = '#F0C96A'; chip.style.color = '#6E4328';
    $('time').textContent = '00:00';
    $('sub1').textContent = 'Belle session, tout est fait.'; $('sub2').textContent = '';
    $('barDone').style.width = '100%';
    $('elapsed').textContent = 'Total : ' + fmtHM(run.total);
    document.title = 'Session terminée';
    return;
  }
  var s = run.sched[run.idx];
  chip.textContent = run.paused ? NAMES[s.t] + ' (en pause)' : NAMES[s.t];
  chip.style.background = CHIP[s.t][0]; chip.style.color = CHIP[s.t][1];
  var tstr = fmtClock(s.b - e);
  $('time').textContent = tstr;
  var k = 0;
  for (var i = 0; i <= run.idx; i++){ if (run.sched[i].t === 'work') k++; }
  $('sub1').textContent = s.t === 'work' ? 'Cycle ' + k + ' sur ' + run.nWork : '';
  var nx = run.sched[run.idx + 1];
  $('sub2').textContent = nx ? 'Ensuite : ' + NEXT[nx.t] + ', ' + fmtDur(nx.d) : 'Ensuite : fin de session';
  $('barDone').style.width = Math.min(100, e / run.total * 100) + '%';
  $('elapsed').textContent = 'Écoulé : ' + fmtHM(e) + ' sur ' + fmtHM(run.total);
  document.title = tstr + ' · ' + NAMES[s.t];
}

function startTicker(){
  stopTicker();
  try {
    var src = 'setInterval(function(){postMessage(0)},500)';
    var url = URL.createObjectURL(new Blob([src], {type:'text/javascript'}));
    worker = new Worker(url);
    worker.onmessage = function(){ tick(); };
  } catch (e) {
    timer = setInterval(tick, 500);
  }
}
function stopTicker(){
  if (worker){ worker.terminate(); worker = null; }
  if (timer){ clearInterval(timer); timer = null; }
}

function togglePause(){
  if (!run || run.done) return;
  var now = Date.now();
  if (run.paused){
    run.pauseTotal += now - run.pausedAt; run.paused = false;
    $('pause').textContent = 'Pause'; lockOn();
  } else {
    run.paused = true; run.pausedAt = now;
    $('pause').textContent = 'Reprendre';
  }
  tick();
}

function stopSession(){
  if (!run) return;
  if (!run.done && $('stop').dataset.confirm !== '1'){
    $('stop').dataset.confirm = '1'; $('stop').textContent = 'Confirmer l\'arrêt';
    clearTimeout(confirmTimer);
    confirmTimer = setTimeout(function(){
      $('stop').dataset.confirm = '0'; if (run && !run.done) $('stop').textContent = 'Arrêter';
    }, 3000);
    return;
  }
  clearTimeout(confirmTimer);
  $('stop').dataset.confirm = '0';
  stopTicker(); lockOff(); run = null;
  $('running').hidden = true; $('setup').hidden = false;
  document.title = BASE_TITLE;
  sceneKey = ''; refreshSetup();
}

/* ============================================================
   8. DÉMARRAGE
   ============================================================ */
loadState();
buildGroup($('g-moment'), OPTS.moment, 'moment', 'opt');
buildGroup($('g-weather'), OPTS.weather, 'weather', 'opt');
var hrs = []; for (var h = 1; h <= 8; h++) hrs.push([h, h + 'h']);
buildGroup($('g-hours'), hrs, 'hours', 'opt');
if (!('wakeLock' in navigator)){
  $('awake').disabled = true; state.awake = false;
  $('awakeNote').textContent = 'Non disponible sur ce navigateur.';
}
$('awake').addEventListener('change', function(){ state.awake = this.checked; saveState(); });
$('t-start').addEventListener('click', function(){ chime('start', true); });
$('t-end').addEventListener('click', function(){ chime('finish', true); });
$('go').addEventListener('click', startSession);
$('pause').addEventListener('click', togglePause);
$('stop').addEventListener('click', stopSession);
$('snd').addEventListener('click', function(){ state.sound = !state.sound; saveState(); paintSound(); });
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'visible' && run){
    ensureAudio();
    if (!run.done && !run.paused && !wl) lockOn();
    tick();
  }
});
paintSound();
refreshSetup();
})();
</script>
